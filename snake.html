<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 贪吃蛇</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
}

.game-wrapper {
    position: relative;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    padding: 30px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
}

.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 0 5px;
}

.game-title {
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(90deg, #00ff88, #00bcd4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
}

.score-panel {
    display: flex;
    gap: 15px;
}

.score-item {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 10px 20px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.score-label {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    text-transform: uppercase;
    letter-spacing: 2px;
}

.score-value {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
}

#current-score {
    color: #00ff88;
}

#high-score {
    color: #ffd700;
}

canvas {
    display: block;
    border-radius: 12px;
    box-shadow:
        0 0 20px rgba(0, 255, 136, 0.15),
        inset 0 0 20px rgba(0, 0, 0, 0.3);
    background: #111827;
}

.game-over-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0, 0, 0, 0.9);
    border-radius: 20px;
    padding: 40px 50px;
    text-align: center;
    border: 2px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.game-over-overlay.active {
    transform: translate(-50%, -50%) scale(1);
}

.game-over-title {
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(90deg, #ff4444, #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
}

.game-over-score {
    font-size: 20px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 8px;
}

.game-over-best {
    font-size: 16px;
    color: #ffd700;
    margin-bottom: 25px;
}

.btn {
    padding: 14px 40px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    outline: none;
}

.btn-restart {
    background: linear-gradient(135deg, #00ff88, #00bcd4);
    color: #000;
    box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
}

.btn-restart:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(0, 255, 136, 0.45);
}

.btn-restart:active {
    transform: translateY(0);
}

.controls-hint {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.key-hint {
    background: rgba(255, 255, 255, 0.06);
    border-radius: 8px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.key-icon {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    font-family: monospace;
}

.key-desc {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.45);
}

.mobile-controls {
    display: none;
    margin-top: 15px;
}

.dpad {
    display: grid;
    grid-template-columns: 70px 70px 70px;
    grid-template-rows: 70px 70px 70px;
    gap: 4px;
    justify-content: center;
}

.dpad-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    font-size: 24px;
    cursor: pointer;
    transition: background 0.15s;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
}

.dpad-btn:active {
    background: rgba(0, 255, 136, 0.3);
}

.dpad-btn.up { grid-column: 2; grid-row: 1; }
.dpad-btn.left { grid-column: 1; grid-row: 2; }
.dpad-btn.center { grid-column: 2; grid-row: 2; background: transparent; border: none; cursor: default; }
.dpad-btn.right { grid-column: 3; grid-row: 2; }
.dpad-btn.down { grid-column: 2; grid-row: 3; }

.pause-badge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0, 0, 0, 0.8);
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    padding: 15px 35px;
    border-radius: 50px;
    pointer-events: none;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    letter-spacing: 3px;
}

.pause-badge.active {
    transform: translate(-50%, -50%) scale(1);
}

@media (max-width: 600px) {
    .game-wrapper { padding: 15px; }
    .game-title { font-size: 22px; }
    .score-value { font-size: 22px; }
    .score-item { padding: 8px 14px; }
    .mobile-controls { display: block; }
    canvas { max-width: 100%; height: auto; }
}
</style>
</head>
<body>

<div class="game-wrapper">
    <div class="game-header">
        <span class="game-title">🐍 贪吃蛇</span>
        <div class="score-panel">
            <div class="score-item">
                <div class="score-label">得分</div>
                <div class="score-value" id="current-score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">最佳</div>
                <div class="score-value" id="high-score">0</div>
            </div>
        </div>
    </div>

    <div style="position: relative; display: inline-block;">
        <canvas id="gameCanvas"></canvas>
        <div class="game-over-overlay" id="gameOverOverlay">
            <div class="game-over-title">游戏结束</div>
            <div class="game-over-score" id="finalScore">得分: 0</div>
            <div class="game-over-best" id="bestScore">最佳: 0</div>
            <button class="btn btn-restart" id="restartBtn">🔄 再来一局</button>
        </div>
        <div class="pause-badge" id="pauseBadge">⏸ 暂停中</div>
    </div>

    <div class="controls-hint">
        <div class="key-hint"><span class="key-icon">↑↓←→</span><span class="key-desc">方向</span></div>
        <div class="key-hint"><span class="key-icon">WASD</span><span class="key-desc">方向</span></div>
        <div class="key-hint"><span class="key-icon">Space</span><span class="key-desc">暂停</span></div>
    </div>

    <div class="mobile-controls">
        <div class="dpad">
            <button class="dpad-btn up" id="btnUp">▲</button>
            <button class="dpad-btn left" id="btnLeft">◀</button>
            <div class="dpad-btn center"></div>
            <button class="dpad-btn right" id="btnRight">▶</button>
            <button class="dpad-btn down" id="btnDown">▼</button>
        </div>
    </div>
</div>

<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GRID_SIZE = 20;
    const CELL_SIZE = 20;
    const COLS = 20;
    const ROWS = 20;

    canvas.width = COLS * CELL_SIZE;
    canvas.height = ROWS * CELL_SIZE;

    let snake = [];
    let food = { x: 0, y: 0 };
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let score = 0;
    let highScore = 0;
    let gameRunning = false;
    let gamePaused = false;
    let gameLoopId = null;
    let baseSpeed = 140;
    let speed = baseSpeed;
    let particles = [];
    let trailPositions = [];
    let lastMoveTime = 0;
    let accumulator = 0;

    const currentScoreEl = document.getElementById('current-score');
    const highScoreEl = document.getElementById('high-score');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreEl = document.getElementById('finalScore');
    const bestScoreEl = document.getElementById('bestScore');
    const restartBtn = document.getElementById('restartBtn');
    const pauseBadge = document.getElementById('pauseBadge');

    highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
    highScoreEl.textContent = highScore;

    function randomCell() {
        return {
            x: Math.floor(Math.random() * COLS),
            y: Math.floor(Math.random() * ROWS)
        };
    }

    function isOnSnake(pos) {
        return snake.some(seg => seg.x === pos.x && seg.y === pos.y);
    }

    function spawnFood() {
        let pos;
        do {
            pos = randomCell();
        } while (isOnSnake(pos));
        food = pos;
    }

    function spawnParticles(x, y) {
        const colors = ['#00ff88', '#00ffcc', '#ffd700', '#ff6b6b', '#00bcd4', '#fff'];
        for (let i = 0; i < 12; i++) {
            const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.5;
            const speed = 1.5 + Math.random() * 3;
            particles.push({
                x: x * CELL_SIZE + CELL_SIZE / 2,
                y: y * CELL_SIZE + CELL_SIZE / 2,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1,
                decay: 0.025 + Math.random() * 0.035,
                color: colors[Math.floor(Math.random() * colors.length)],
                size: 2 + Math.random() * 3
            });
        }
    }

    function initGame() {
        snake = [
            { x: 5, y: 10 },
            { x: 4, y: 10 },
            { x: 3, y: 10 }
        ];
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        speed = baseSpeed;
        particles = [];
        trailPositions = [];
        accumulator = 0;
        currentScoreEl.textContent = '0';
        spawnFood();
        gameOverOverlay.classList.remove('active');
        pauseBadge.classList.remove('active');
        gamePaused = false;
    }

    function gameOver() {
        gameRunning = false;
        cancelAnimationFrame(gameLoopId);

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('snakeHighScore', highScore);
            highScoreEl.textContent = highScore;
        }

        finalScoreEl.textContent = '得分: ' + score;
        bestScoreEl.textContent = '最佳: ' + highScore;
        gameOverOverlay.classList.add('active');
    }

    function update() {
        if (!gameRunning || gamePaused) return;

        direction = { ...nextDirection };

        const head = snake[0];
        const newHead = {
            x: head.x + direction.x,
            y: head.y + direction.y
        };

        if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
            gameOver();
            return;
        }

        if (isOnSnake(newHead)) {
            gameOver();
            return;
        }

        snake.unshift(newHead);

        if (newHead.x === food.x && newHead.y === food.y) {
            score += 10;
            currentScoreEl.textContent = score;
            spawnParticles(food.x, food.y);
            spawnFood();

            speed = Math.max(50, baseSpeed - Math.floor(score / 30) * 5);
        } else {
            snake.pop();
        }

        trailPositions.push({ x: newHead.x, y: newHead.y, life: 1 });
        trailPositions = trailPositions.filter(t => {
            t.life -= 0.06;
            return t.life > 0;
        });

        particles = particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
            return p.life > 0;
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Grid background
        ctx.fillStyle = '#111827';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,0.02)';
        ctx.lineWidth = 0.5;
        for (let x = 0; x <= COLS; x++) {
            ctx.beginPath();
            ctx.moveTo(x * CELL_SIZE, 0);
            ctx.lineTo(x * CELL_SIZE, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y <= ROWS; y++) {
            ctx.beginPath();
            ctx.moveTo(0, y * CELL_SIZE);
            ctx.lineTo(canvas.width, y * CELL_SIZE);
            ctx.stroke();
        }

        // Trail
        trailPositions.forEach(t => {
            ctx.fillStyle = `rgba(0,255,136,${t.life * 0.15})`;
            ctx.beginPath();
            ctx.roundRect(t.x * CELL_SIZE + 2, t.y * CELL_SIZE + 2, CELL_SIZE - 4, CELL_SIZE - 4, 4);
            ctx.fill();
        });

        // Food with glow
        const foodCx = food.x * CELL_SIZE + CELL_SIZE / 2;
        const foodCy = food.y * CELL_SIZE + CELL_SIZE / 2;
        const pulse = 1 + Math.sin(Date.now() / 300) * 0.2;

        // Glow
        const glowGrad = ctx.createRadialGradient(foodCx, foodCy, CELL_SIZE * 0.15, foodCx, foodCy, CELL_SIZE * 0.8);
        glowGrad.addColorStop(0, 'rgba(255,80,80,0.5)');
        glowGrad.addColorStop(1, 'rgba(255,80,80,0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(foodCx, foodCy, CELL_SIZE * 0.8 * pulse, 0, Math.PI * 2);
        ctx.fill();

        // Food body
        const foodGrad = ctx.createRadialGradient(foodCx - 2, foodCy - 2, 1, foodCx, foodCy, CELL_SIZE * 0.45);
        foodGrad.addColorStop(0, '#ff6b6b');
        foodGrad.addColorStop(0.6, '#e74c3c');
        foodGrad.addColorStop(1, '#c0392b');
        ctx.fillStyle = foodGrad;
        ctx.beginPath();
        ctx.roundRect(food.x * CELL_SIZE + 3, food.y * CELL_SIZE + 3, CELL_SIZE - 6, CELL_SIZE - 6, 5);
        ctx.fill();

        // Particle effects
        particles.forEach(p => {
            ctx.fillStyle = p.color.replace(')', `,${p.life})`).replace('rgb', 'rgba');
            if (p.color.startsWith('#')) {
                const r = parseInt(p.color.slice(1, 3), 16);
                const g = parseInt(p.color.slice(3, 5), 16);
                const b = parseInt(p.color.slice(5, 7), 16);
                ctx.fillStyle = `rgba(${r},${g},${b},${p.life})`;
            }
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        });

        // Snake body
        snake.forEach((seg, i) => {
            const sx = seg.x * CELL_SIZE;
            const sy = seg.y * CELL_SIZE;
            const progress = i / Math.max(snake.length - 1, 1);

            // Body gradient
            const r = Math.floor(0 + progress * 0);
            const g = Math.floor(255 - progress * 120);
            const b = Math.floor(136 - progress * 50);

            if (i === 0) {
                // Head with glow
                const headGlow = ctx.createRadialGradient(
                    sx + CELL_SIZE / 2, sy + CELL_SIZE / 2, 2,
                    sx + CELL_SIZE / 2, sy + CELL_SIZE / 2, CELL_SIZE * 0.7
                );
                headGlow.addColorStop(0, 'rgba(0,255,136,0.4)');
                headGlow.addColorStop(1, 'rgba(0,255,136,0)');
                ctx.fillStyle = headGlow;
                ctx.beginPath();
                ctx.arc(sx + CELL_SIZE / 2, sy + CELL_SIZE / 2, CELL_SIZE * 0.7, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#00ff88';
                ctx.shadowColor = '#00ff88';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.roundRect(sx + 1, sy + 1, CELL_SIZE - 2, CELL_SIZE - 2, 6);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Eyes
                const eyeSize = 3.5;
                ctx.fillStyle = '#000';
                let ex1, ey1, ex2, ey2;
                if (direction.x === 1) {
                    ex1 = sx + CELL_SIZE - 6; ey1 = sy + 6;
                    ex2 = sx + CELL_SIZE - 6; ey2 = sy + CELL_SIZE - 6;
                } else if (direction.x === -1) {
                    ex1 = sx + 6; ey1 = sy + 6;
                    ex2 = sx + 6; ey2 = sy + CELL_SIZE - 6;
                } else if (direction.y === -1) {
                    ex1 = sx + 6; ey1 = sy + 6;
                    ex2 = sx + CELL_SIZE - 6; ey2 = sy + 6;
                } else {
                    ex1 = sx + 6; ey1 = sy + CELL_SIZE - 6;
                    ex2 = sx + CELL_SIZE - 6; ey2 = sy + CELL_SIZE - 6;
                }
                ctx.beginPath();
                ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
                ctx.fill();

            } else if (i === snake.length - 1) {
                // Tail
                ctx.fillStyle = `rgb(${r},${Math.floor(g)},${Math.floor(b)})`;
                ctx.beginPath();
                ctx.roundRect(sx + 2, sy + 2, CELL_SIZE - 4, CELL_SIZE - 4, 5);
                ctx.fill();
            } else {
                // Body segments
                const alpha = 1 - progress * 0.4;
                ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                ctx.beginPath();
                ctx.roundRect(sx + 1.5, sy + 1.5, CELL_SIZE - 3, CELL_SIZE - 3, 5);
                ctx.fill();

                // Scale pattern
                ctx.fillStyle = `rgba(255,255,255,${0.06 * (1 - progress)})`;
                ctx.beginPath();
                ctx.roundRect(sx + 4, sy + 4, CELL_SIZE / 2 - 2, CELL_SIZE / 2 - 2, 3);
                ctx.fill();
            }
        });

        // Pause overlay dim
        if (gamePaused) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    }

    function gameLoop(timestamp) {
        if (!gameRunning) return;

        gameLoopId = requestAnimationFrame(gameLoop);

        if (gamePaused) {
            draw();
            return;
        }

        if (!lastMoveTime) lastMoveTime = timestamp;
        accumulator += timestamp - lastMoveTime;
        lastMoveTime = timestamp;

        let updated = false;
        while (accumulator >= speed) {
            update();
            accumulator -= speed;
            updated = true;
            if (!gameRunning) {
                draw();
                return;
            }
        }

        if (updated) {
            draw();
        }
    }

    function startGame() {
        initGame();
        gameRunning = true;
        lastMoveTime = 0;
        accumulator = 0;
        gameLoopId = requestAnimationFrame(gameLoop);
    }

    function changeDirection(dx, dy) {
        if (!gameRunning || gamePaused) return;
        if (direction.x === -dx && direction.y === -dy) return;
        nextDirection = { x: dx, y: dy };
    }

    // Keyboard
    document.addEventListener('keydown', function(e) {
        const keyMap = {
            'ArrowUp':    [0, -1],
            'ArrowDown':  [0, 1],
            'ArrowLeft':  [-1, 0],
            'ArrowRight': [1, 0],
            'w': [0, -1], 'W': [0, -1],
            's': [0, 1],  'S': [0, 1],
            'a': [-1, 0], 'A': [-1, 0],
            'd': [1, 0],  'D': [1, 0]
        };

        if (keyMap[e.key]) {
            e.preventDefault();
            changeDirection(keyMap[e.key][0], keyMap[e.key][1]);
        }

        if (e.key === ' ' || e.code === 'Space') {
            e.preventDefault();
            if (!gameRunning) {
                startGame();
            } else {
                gamePaused = !gamePaused;
                if (gamePaused) {
                    pauseBadge.classList.add('active');
                } else {
                    pauseBadge.classList.remove('active');
                    lastMoveTime = 0;
                    accumulator = 0;
                }
            }
        }
    });

    // Mobile controls
    document.getElementById('btnUp').addEventListener('pointerdown', function(e) {
        e.preventDefault();
        changeDirection(0, -1);
    });
    document.getElementById('btnDown').addEventListener('pointerdown', function(e) {
        e.preventDefault();
        changeDirection(0, 1);
    });
    document.getElementById('btnLeft').addEventListener('pointerdown', function(e) {
        e.preventDefault();
        changeDirection(-1, 0);
    });
    document.getElementById('btnRight').addEventListener('pointerdown', function(e) {
        e.preventDefault();
        changeDirection(1, 0);
    });

    // Touch swipe support
    let touchStartX = 0;
    let touchStartY = 0;
    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    });
    canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
    });
    canvas.addEventListener('touchend', function(e) {
        e.preventDefault();
        if (!touchStartX || !touchStartY) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        const absDx = Math.abs(dx);
        const absDy = Math.abs(dy);

        if (Math.max(absDx, absDy) < 15) return;

        if (absDx > absDy) {
            changeDirection(dx > 0 ? 1 : -1, 0);
        } else {
            changeDirection(0, dy > 0 ? 1 : -1);
        }

        touchStartX = 0;
        touchStartY = 0;
    });

    // Restart button
    restartBtn.addEventListener('click', function() {
        gameOverOverlay.classList.remove('active');
        startGame();
    });

    // Glow animation for score flash
    function flashScore() {
        const prev = parseInt(currentScoreEl.textContent);
        const check = setInterval(() => {
            if (parseInt(currentScoreEl.textContent) !== prev) {
                currentScoreEl.style.transform = 'scale(1.3)';
                currentScoreEl.style.transition = 'transform 0.15s ease';
                setTimeout(() => {
                    currentScoreEl.style.transform = 'scale(1)';
                }, 150);
                clearInterval(check);
            }
        }, 50);
    }

    // Override score update to add flash
    const origDraw = draw;
    draw = function() {
        origDraw();
    };

    startGame();
})();
</script>

</body>
</html>
